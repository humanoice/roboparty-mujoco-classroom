[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x720x24 +extension GLX +render -noreset
priority=10
autorestart=true

[program:openbox]
command=/bin/bash -c "sleep 2; exec openbox --config-file /etc/classroom/openbox-rc.xml"
priority=20
autorestart=true

[program:vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900 -wait 50 -defer 50
priority=30
autorestart=true
startretries=20

[program:web]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=40
autorestart=true

; MuJoCo body + real RoboParty inference_node + virtual "Y" button.
[program:robot]
command=/bin/bash -c "sleep 3; exec /etc/classroom/entrypoint.sh ros2 launch roboparty_sim sim.launch.py policy:=%(ENV_RPO_POLICY)s"
priority=50
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/robot.log
stderr_logfile=/tmp/robot-error.log

; Keyboard remote control window.
[program:remote]
command=/bin/bash -c "sleep 6; exec /etc/classroom/entrypoint.sh /opt/ros2_ws/install/roboparty_sim/lib/roboparty_sim/remote"
priority=60
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/remote.log
stderr_logfile=/tmp/remote-error.log

; A terminal for typing "party" commands.
[program:terminal]
command=/bin/bash -c "sleep 4; exec xterm -geometry 64x22+800+360 -fa Monospace -fs 10 -title 'party terminal' -e bash -i"
priority=70
autorestart=true
